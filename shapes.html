<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#87ceeb">
<title>형태 미리보기 — Katamari</title>
<style>
  /* 게임과 같은 이유로 웹폰트를 쓰지 않는다. @import 는 렌더링을 막는다. */
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #87ceeb;
    font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    color: #1b1230;
  }
  #view { display: block; width: 100%; height: 100%; }
  #title {
    position: fixed; top: 12px; left: 16px; font-size: 12px; letter-spacing: .06em;
    color: rgba(27,18,48,.75); pointer-events: none;
  }
  /* 전체 보기: 줄마다 왼쪽에 크기 구간 */
  #rows { position: fixed; inset: 0; pointer-events: none; }
  #rows .rowlabel {
    position: fixed; left: 14px; font-size: 10px; font-weight: 700;
    letter-spacing: .06em; color: rgba(27,18,48,.7);
  }
  /* 한 줄 보기(?row=N): 물체 아래 이름 7개 */
  #labels { position: fixed; display: flex; pointer-events: none; }
  #labels div {
    flex: 1; text-align: center; font-size: 11px; letter-spacing: .02em;
    color: rgba(27,18,48,.85);
  }
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="title"></div>
  <div id="rows"></div>
  <div id="labels"></div>
  <script type="module" src="/src/shapes-preview.ts"></script>
</body>
</html>
